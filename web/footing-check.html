<title>Footing Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --ground:#e8ecf0; --panel:#ffffff; --panel-2:#f3f6f9; --sunk:#dfe6ec;
  --ink:#16202b; --ink-soft:#5b6b7a; --ink-faint:#8a98a5;
  --rule:#ccd6de; --rule-hard:#1f2c39;
  --blue:#1c4f82; --blue-wash:#e9f0f8;
  --ochre:#8a5a00; --ochre-wash:#fbf2de;
  --green:#15613a; --green-wash:#e3f0e9;
  --red:#9c2620; --red-wash:#f9e8e6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:18px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ground:#0e141a; --panel:#18212b; --panel-2:#1e2833; --sunk:#131b23;
    --ink:#dde5ec; --ink-soft:#9aa9b6; --ink-faint:#6d7d8a;
    --rule:#2c3946; --rule-hard:#465564;
    --blue:#77b0e6; --blue-wash:#17293c;
    --ochre:#dda945; --ochre-wash:#31280f;
    --green:#5cc48d; --green-wash:#11291d;
    --red:#ef8378; --red-wash:#301715;
  }
}
:root[data-theme="dark"]{
  --ground:#0e141a; --panel:#18212b; --panel-2:#1e2833; --sunk:#131b23;
  --ink:#dde5ec; --ink-soft:#9aa9b6; --ink-faint:#6d7d8a;
  --rule:#2c3946; --rule-hard:#465564;
  --blue:#77b0e6; --blue-wash:#17293c;
  --ochre:#dda945; --ochre-wash:#31280f;
  --green:#5cc48d; --green-wash:#11291d;
  --red:#ef8378; --red-wash:#301715;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

/* ---- masthead ---- */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;
  flex-wrap:wrap;border-bottom:2.5px solid var(--rule-hard);padding-bottom:10px;margin-bottom:16px}
h1{font:700 30px/1 var(--display);margin:0;letter-spacing:.01em}
.tag{font:600 13px/1.3 var(--display);color:var(--blue);text-transform:uppercase;
  letter-spacing:.12em;margin-top:4px}
.privacy{font:500 12px/1.4 var(--display);color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.07em;text-align:right}
.privacy b{color:var(--green)}

/* ---- layout ---- */
.cols{display:grid;grid-template-columns:minmax(330px,400px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  padding:var(--pad)}
.panel + .panel{margin-top:14px}
h2{font:600 13px/1.2 var(--display);text-transform:uppercase;letter-spacing:.12em;
  margin:0 0 10px;padding-bottom:6px;border-bottom:1.5px solid var(--rule-hard);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 .hint{font:400 12px/1.3 var(--body);text-transform:none;letter-spacing:0;
  color:var(--ink-faint)}
h3{font:600 12px/1.2 var(--display);text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-soft);margin:14px 0 6px}

/* ---- controls ---- */
label{display:block;font:500 11.5px/1.3 var(--display);text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-soft);margin-bottom:3px}
input,select{width:100%;padding:6px 8px;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;font:500 14px/1.3 var(--mono);
  font-variant-numeric:tabular-nums}
select{font-family:var(--body);font-weight:400}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);
  outline-offset:1px}
.grid{display:grid;gap:9px 10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:480px){.g3,.g4{grid-template-columns:1fr 1fr}}

/* ---- jurisdiction stamp ---- */
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.code-btn{background:var(--panel-2);border:1.5px solid var(--rule);border-radius:2px;
  padding:9px 10px;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--body)}
.code-btn .n{font:700 17px/1.1 var(--display);letter-spacing:.02em}
.code-btn .s{font:500 11px/1.3 var(--display);text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft);margin-top:2px}
.code-btn .f{font:500 12px/1.3 var(--mono);color:var(--ink-faint);margin-top:5px}
.code-btn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-wash)}
.code-btn[aria-pressed="true"] .n,.code-btn[aria-pressed="true"] .f{color:var(--blue)}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;padding:4px 12px;cursor:pointer;
  color:var(--ink-soft);font:600 12px/1.4 var(--display);text-transform:uppercase;
  letter-spacing:.08em}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* ---- layer cards ---- */
.layer{border:1px solid var(--rule);border-left:3px solid var(--blue);border-radius:2px;
  padding:10px;margin-bottom:9px;background:var(--panel-2)}
.layer.cohesive{border-left-color:var(--ochre)}
.layer-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.layer-head input{flex:1;font-family:var(--body);font-weight:600}
.icon-btn{flex:0 0 auto;width:26px;height:26px;padding:0;background:var(--panel);
  border:1px solid var(--rule);border-radius:2px;color:var(--ink-soft);cursor:pointer;
  font:600 15px/1 var(--body)}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.add-btn{width:100%;padding:7px;background:var(--panel-2);border:1px dashed var(--rule);
  border-radius:2px;color:var(--ink-soft);cursor:pointer;
  font:600 12px/1.3 var(--display);text-transform:uppercase;letter-spacing:.09em}
.add-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ---- verdict ---- */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;
  border:1.5px solid var(--rule);border-radius:3px;padding:14px 16px;background:var(--panel-2)}
.verdict.ok{border-color:var(--green);background:var(--green-wash)}
.verdict.fail{border-color:var(--red);background:var(--red-wash)}
.size{font:700 40px/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.verdict.ok .size{color:var(--green)} .verdict.fail .size{color:var(--red)}
.size small{font-size:19px;font-weight:600;color:var(--ink-soft)}
.verdict-meta{font-size:14px}
.verdict-meta b{font:600 13px/1.3 var(--display);text-transform:uppercase;letter-spacing:.09em}

/* ---- limit state checks ---- */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:640px){.checks{grid-template-columns:1fr}.verdict{grid-template-columns:1fr}}
.check{border:1px solid var(--rule);border-radius:3px;padding:12px;background:var(--panel-2)}
.check.governs{border-color:var(--blue);border-width:1.5px;box-shadow:inset 3px 0 0 var(--blue)}
.check-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:2px}
.check-name{font:600 12px/1.2 var(--display);text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-soft)}
.check-badge{font:600 10.5px/1.4 var(--display);text-transform:uppercase;letter-spacing:.09em;
  padding:1px 7px;border-radius:2px;background:var(--blue);color:#fff}
.check-val{font:600 15px/1.35 var(--mono);font-variant-numeric:tabular-nums;margin:6px 0}
.check-val .op{color:var(--ink-faint);padding:0 4px}
.bar{height:7px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:9px}
.bar span{display:block;height:100%;background:var(--green);transition:width .18s ease}
.bar.over span{background:var(--red)}
.bar-foot{display:flex;justify-content:space-between;font:500 11.5px/1.4 var(--mono);
  color:var(--ink-soft);margin-top:4px}
.basis{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.45}

/* ---- tables ---- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{font:600 11px/1.3 var(--display);text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-soft);background:var(--blue-wash);border-bottom:1.5px solid var(--rule-hard);
  white-space:nowrap}
tbody td{font-family:var(--mono);font-size:12.5px}
tbody td:first-child,td.t{font-family:var(--body);text-align:left}
tfoot td{font-weight:700;font-family:var(--mono);border-top:1.5px solid var(--rule-hard);
  border-bottom:none}
.g{text-transform:none}

/* ---- notes ---- */
.notes{background:var(--ochre-wash);border-left:3px solid var(--ochre);border-radius:2px;
  padding:10px 14px;margin-top:12px}
.notes li{margin:6px 0;font-size:13.5px}
.notes ol,.notes ul{margin:0;padding-left:18px}
.err{background:var(--red-wash);border-left:3px solid var(--red);border-radius:2px;
  padding:12px 14px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px}
.kv dt{font:500 11.5px/1.5 var(--display);text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-soft);line-height:1.55}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="mast">
    <div>
      <h1>Footing Check</h1>
      <div class="tag">Bearing capacity &amp; settlement &middot; US and Canadian codes</div>
    </div>
    <div class="privacy">Runs entirely in your browser<br><b>No data is sent anywhere</b></div>
  </div>

  <div class="cols">
    <!-- ============ INPUTS ============ -->
    <div>
      <div class="panel">
        <h2>Design code</h2>
        <div class="codes" id="codes"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px">
          <label style="margin:0">Units</label>
          <div class="seg" id="units">
            <button type="button" data-u="US" aria-pressed="true">ft &middot; kip</button>
            <button type="button" data-u="SI" aria-pressed="false">m &middot; kN</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Column load <span class="hint" id="loadHint"></span></h2>
        <div class="grid g2">
          <div><label for="dead">Dead <span id="uF1"></span></label><input id="dead" type="number" step="any"></div>
          <div><label for="live">Live <span id="uF2"></span></label><input id="live" type="number" step="any"></div>
          <div><label for="horiz">Horizontal <span id="uF3"></span></label><input id="horiz" type="number" step="any"></div>
          <div><label for="moment">Moment <span id="uM1"></span></label><input id="moment" type="number" step="any"></div>
          <div><label for="colb">Column width <span id="uL1"></span></label><input id="colb" type="number" step="any"></div>
          <div><label for="embed">Embedment <span id="uL2"></span></label><input id="embed" type="number" step="any"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Soil profile <span class="hint">from grade down</span></h2>
        <div id="layers"></div>
        <button class="add-btn" type="button" id="addLayer">+ Add layer</button>
        <div style="margin-top:11px">
          <label for="wt">Water table depth <span id="uL3"></span> &mdash; blank if not encountered</label>
          <input id="wt" type="number" step="any" placeholder="not encountered">
        </div>
      </div>

      <div class="panel">
        <h2>Criteria</h2>
        <div class="grid g2">
          <div><label for="settle">Settlement limit <span id="uS1"></span></label><input id="settle" type="number" step="any"></div>
          <div id="factorWrap"><label for="factor" id="factorLabel">Factor of safety</label><input id="factor" type="number" step="any"></div>
          <div><label for="maxw">Max width <span id="uL4"></span></label><input id="maxw" type="number" step="any"></div>
          <div><label for="incr">Size increment <span id="uL5"></span></label><input id="incr" type="number" step="any"></div>
          <div><label for="aspect">Aspect ratio L/B</label><input id="aspect" type="number" step="any"></div>
          <div><label for="method">N<span class="g">&gamma;</span> method</label>
            <select id="method">
              <option value="vesic">Vesic</option><option value="hansen">Hansen</option>
              <option value="meyerhof">Meyerhof</option>
            </select></div>
        </div>
      </div>
    </div>

    <!-- ============ RESULTS ============ -->
    <div>
      <div class="panel" id="resultPanel"><div id="result"></div></div>
      <div class="panel" id="detailPanel"><div id="detail"></div></div>
      <div class="panel">
        <h2>Basis &amp; limitations</h2>
        <div id="basis"></div>
      </div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>/* Burh engine - browser port.
 *
 * A faithful port of the Python engine in burh/. The two are cross-checked
 * against each other by web/crossvalidate.mjs over randomised cases; any
 * divergence beyond 1e-9 is a build failure.
 *
 * Everything internal is SI: m, kN, kPa, kN/m3. Conversion happens only at
 * the boundary, exactly as in the Python.
 */
const Burh = (function () {
  "use strict";

  // ---- constants (exact) --------------------------------------------------
  const FT_TO_M = 0.3048;
  const IN_TO_M = 0.0254;
  const KIP_TO_KN = 4.4482216152605;
  const KSF_TO_KPA = KIP_TO_KN / (FT_TO_M * FT_TO_M);
  const PCF_TO_KNM3 = (KIP_TO_KN / 1000.0) / (FT_TO_M ** 3);
  const P_ATM_KPA = 101.325;
  const GAMMA_WATER = 9.81;
  const GAMMA_CONCRETE = 23.6;
  const N_C_PHI_ZERO = Math.PI + 2.0;

  const UNITS = {
    SI: { length: 1, force: 1, stress: 1, unitWeight: 1, settle: 1000,
          labels: { length: "m", force: "kN", stress: "kPa", unitWeight: "kN/m³",
                    moment: "kN·m", small: "mm" } },
    US: { length: FT_TO_M, force: KIP_TO_KN, stress: KSF_TO_KPA,
          unitWeight: PCF_TO_KNM3, settle: 1 / IN_TO_M,
          labels: { length: "ft", force: "kip", stress: "ksf", unitWeight: "pcf",
                    moment: "kip·ft", small: "in" } },
  };

  function units(system) {
    const f = UNITS[system];
    if (!f) throw new Error(`Unknown unit system ${system}`);
    return {
      system,
      labels: f.labels,
      toLength: v => v * f.length,
      toForce: v => v * f.force,
      toStress: v => v * f.stress,
      toUnitWeight: v => v * f.unitWeight,
      toMoment: v => v * f.force * f.length,
      toSettle: v => v / f.settle,
      fromLength: v => v / f.length,
      fromForce: v => v / f.force,
      fromStress: v => v / f.stress,
      fromUnitWeight: v => v / f.unitWeight,
      fromMoment: v => v / (f.force * f.length),
      fromSettle: v => v * f.settle,
    };
  }

  const rad = d => (d * Math.PI) / 180.0;
  const deg = r => (r * 180.0) / Math.PI;

  // ---- soil ---------------------------------------------------------------
  const ALPHA_E = { sand_with_fines: 5.0, clean_sand_nc: 10.0, clean_sand_oc: 15.0 };
  const SIGMA_V_FLOOR_KPA = 25.0;
  const PHI_CAP_DEG = 40.0;
  const PHI_FLOOR_DEG = 25.0;

  function makeLayer(o) {
    const L = Object.assign({
      name: "Layer", thickness: 1, gamma: 18, gammaSat: null,
      drainage: "drained", phi: 0, cohesion: 0, elasticModulus: null,
      sptN: null, energyRatio: 60, cc: null, cr: null, e0: null, ocr: 1,
      soilClass: "clean_sand_nc", notes: [],
    }, o);
    if (!(L.thickness > 0)) throw new Error(`Layer "${L.name}": thickness must be > 0.`);
    if (!(L.gamma > 0)) throw new Error(`Layer "${L.name}": unit weight must be > 0.`);
    if (L.gammaSat === null || L.gammaSat === undefined) L.gammaSat = L.gamma;
    if (L.gammaSat < L.gamma)
      throw new Error(`Layer "${L.name}": saturated unit weight cannot be less than the moist value.`);
    if (L.gammaSat <= GAMMA_WATER)
      throw new Error(`Layer "${L.name}": saturated unit weight must exceed that of water (${GAMMA_WATER} kN/m³).`);
    if (!(L.phi >= 0 && L.phi < 60)) throw new Error(`Layer "${L.name}": phi must satisfy 0 <= phi < 60.`);
    if (L.cohesion < 0) throw new Error(`Layer "${L.name}": cohesion must be >= 0.`);
    if (L.ocr < 1) throw new Error(`Layer "${L.name}": OCR must be >= 1.`);
    if (L.drainage === "undrained" && L.phi !== 0)
      throw new Error(`Layer "${L.name}": an undrained analysis requires phi = 0.`);
    if (L.drainage === "undrained" && !(L.cohesion > 0))
      throw new Error(`Layer "${L.name}": an undrained analysis requires su > 0.`);
    if (!(L.soilClass in ALPHA_E)) throw new Error(`Layer "${L.name}": unknown soil class.`);
    L.gammaBuoyant = L.gammaSat - GAMMA_WATER;
    L.isCohesive = L.drainage === "undrained";
    return L;
  }

  function makeProfile(layers, waterTableDepth) {
    if (!layers || !layers.length) throw new Error("A soil profile needs at least one layer.");
    const wt = (waterTableDepth === null || waterTableDepth === undefined) ? Infinity : waterTableDepth;
    if (wt < 0) throw new Error("Water table depth must be >= 0.");
    const tops = [];
    let z = 0;
    for (const l of layers) { tops.push(z); z += l.thickness; }
    const totalDepth = z;

    function layerAt(depth) {
      if (depth < 0) throw new Error("Depth must be >= 0.");
      for (let i = 0; i < layers.length; i++)
        if (depth < tops[i] + layers[i].thickness) return layers[i];
      return layers[layers.length - 1];
    }
    function stressAt(depth) {
      if (depth < 0) throw new Error("Depth must be >= 0.");
      let total = 0, cur = 0;
      for (let i = 0; i < layers.length; i++) {
        const layer = layers[i], top = tops[i], bottom = top + layer.thickness;
        const segBottom = Math.min(bottom, depth);
        if (segBottom <= cur) continue;
        const dryTop = cur, dryBottom = Math.min(segBottom, Math.max(wt, cur));
        if (dryBottom > dryTop) total += layer.gamma * (dryBottom - dryTop);
        const wetTop = Math.max(cur, Math.min(wt, segBottom));
        if (segBottom > wetTop) total += layer.gammaSat * (segBottom - wetTop);
        cur = segBottom;
        if (cur >= depth) break;
      }
      if (depth > cur) {
        const last = layers[layers.length - 1];
        const dryBottom = Math.min(depth, Math.max(wt, cur));
        if (dryBottom > cur) total += last.gamma * (dryBottom - cur);
        const wetTop = Math.max(cur, Math.min(wt, depth));
        if (depth > wetTop) total += last.gammaSat * (depth - wetTop);
      }
      const u = Number.isFinite(wt) ? GAMMA_WATER * Math.max(0, depth - wt) : 0;
      return { depth, total, pore: u, effective: total - u };
    }
    return {
      layers, tops, totalDepth, waterTableDepth: wt, layerAt, stressAt,
      effectiveStress: d => stressAt(d).effective,
      layerTop: i => tops[i],
      layerBottom: i => tops[i] + layers[i].thickness,
      extendsBelow: d => totalDepth >= d - 1e-9,
    };
  }

  const n60 = (nField, energyRatio = 60) => nField * (energyRatio / 60.0);
  const overburdenFactor = (sv, cap = 1.7) =>
    sv <= 0 ? cap : Math.min(cap, Math.sqrt(P_ATM_KPA / sv));

  function phiFromSpt(nField, sigmaVEff, energyRatio = 60, method = "kulhawy_mayne_1990") {
    const notes = [];
    let sv = sigmaVEff;
    if (sv < SIGMA_V_FLOOR_KPA) {
      // Atmospheres, not kPa: the correlation normalises on atmospheric
      // pressure, so this is its natural frame and is dimensionless - which
      // keeps the note correct on a page displaying ksf as well as kPa.
      notes.push(`evaluated at the correlation's low-stress floor of ` +
        `${(SIGMA_V_FLOOR_KPA / P_ATM_KPA).toFixed(2)} atm rather than the actual ` +
        `${(sv / P_ATM_KPA).toFixed(2)} atm of effective overburden, which is below ` +
        `the range it was regressed over`);
      sv = SIGMA_V_FLOOR_KPA;
    }
    const n_60 = n60(nField, energyRatio);
    let phi, cite;
    if (method === "hatanaka_uchida_1996") {
      phi = Math.sqrt(20.0 * n_60 * overburdenFactor(sv)) + 20.0;
      cite = "Hatanaka & Uchida (1996)";
    } else if (method === "wolff_1989") {
      const n1 = n_60 * overburdenFactor(sv);
      phi = 27.1 + 0.3 * n1 - 0.00054 * n1 * n1;
      cite = "Wolff (1989)";
    } else {
      const denom = 12.2 + 20.3 * (Math.max(sv, 1e-6) / P_ATM_KPA);
      phi = deg(Math.atan(Math.pow(Math.max(n_60, 1e-6) / denom, 0.34)));
      cite = "Kulhawy & Mayne (1990)";
    }
    const raw = phi;
    phi = Math.max(PHI_FLOOR_DEG, Math.min(PHI_CAP_DEG, phi));
    if (raw > PHI_CAP_DEG)
      notes.push(`correlation returned ${raw.toFixed(1)}° and has been capped at ${PHI_CAP_DEG}°; ` +
                 `verify with triaxial data before relying on a higher friction angle`);
    else if (raw < PHI_FLOOR_DEG)
      notes.push(`correlation returned ${raw.toFixed(1)}°, raised to the ${PHI_FLOOR_DEG}° floor`);
    if (notes.length) cite = `${cite} [${notes.join("; ")}]`;
    return { phi, cite };
  }

  function esFromSpt(nField, energyRatio = 60, soilClass = "clean_sand_nc") {
    const a = ALPHA_E[soilClass];
    if (a === undefined) throw new Error(`Unknown soil class ${soilClass}`);
    return a * n60(nField, energyRatio) * P_ATM_KPA;
  }

  // ---- stress -------------------------------------------------------------
  function newmarkCorner(m, n) {
    if (m < 0 || n < 0) throw new Error("m and n must be non-negative.");
    if (m === 0 || n === 0) return 0;
    const m2 = m * m, n2 = n * n, s = m2 + n2 + 1.0, root = Math.sqrt(s);
    const num = 2.0 * m * n * root;
    const first = (num / (s + m2 * n2)) * ((m2 + n2 + 2.0) / s);
    // atan2 supplies the correct branch when m^2 n^2 > m^2+n^2+1; plain atan
    // would silently lose the +pi and collapse wide, shallow areas.
    const angle = Math.atan2(num, s - m2 * n2);
    return (first + angle) / (4.0 * Math.PI);
  }
  function boussinesqCenter(q, b, l, z) {
    if (z <= 0) return q;
    if (b <= 0 || l <= 0) throw new Error("Loaded area dimensions must be positive.");
    return 4.0 * q * newmarkCorner((b / 2) / z, (l / 2) / z);
  }
  function influenceDepth(b, l, q, threshold = 0.10, zMaxRatio = 10.0) {
    let lo = 0, hi = zMaxRatio * Math.max(b, l);
    for (let i = 0; i < 80; i++) {
      const mid = 0.5 * (lo + hi);
      if (boussinesqCenter(q, b, l, mid) > threshold * q) lo = mid; else hi = mid;
    }
    return 0.5 * (lo + hi);
  }

  // ---- bearing ------------------------------------------------------------
  function bearingFactors(phiDeg, method = "vesic") {
    if (phiDeg < 0 || phiDeg >= 60) throw new Error(`phi = ${phiDeg}° outside [0, 60).`);
    if (phiDeg === 0) return { nc: N_C_PHI_ZERO, nq: 1.0, ngamma: 0.0, method };
    const phi = rad(phiDeg);
    const nq = Math.exp(Math.PI * Math.tan(phi)) * Math.pow(Math.tan(rad(45 + phiDeg / 2)), 2);
    const nc = (nq - 1.0) / Math.tan(phi);
    let ngamma;
    if (method === "hansen") ngamma = 1.5 * (nq - 1.0) * Math.tan(phi);
    else if (method === "meyerhof") ngamma = (nq - 1.0) * Math.tan(1.4 * phi);
    else ngamma = 2.0 * (nq + 1.0) * Math.tan(phi);
    return { nc, nq, ngamma, method };
  }

  function shapeFactors(bEff, lEff, phiDeg, nq, nc) {
    const r = bEff / lEff, phi = rad(phiDeg);
    return { sc: 1 + r * (nq / nc), sq: 1 + r * Math.tan(phi), sg: Math.max(0.6, 1 - 0.4 * r) };
  }

  function depthFactors(df, b, phiDeg) {
    if (b <= 0) throw new Error("Footing width must be positive.");
    const ratio = df / b;
    const k = ratio <= 1.0 ? ratio : Math.atan(ratio);   // radians beyond Df/B = 1
    const phi = rad(phiDeg);
    const dq = 1 + 2 * Math.tan(phi) * Math.pow(1 - Math.sin(phi), 2) * k;
    const dc = phiDeg === 0 ? 1 + 0.4 * k
      : dq - (1 - dq) / (bearingFactors(phiDeg).nc * Math.tan(phi));
    return { dc, dq, dg: 1.0, k };
  }

  function inclinationFactors(v, h, bEff, lEff, phiDeg, cohesion, nc, nq, thetaFromL = 90) {
    if (h <= 0) return { ic: 1, iq: 1, ig: 1, m: 0 };
    if (v <= 0) throw new Error("Vertical load must be > 0 to evaluate load inclination.");
    const r = bEff / lEff;
    const mB = (2 + r) / (1 + r), mL = (2 + 1 / r) / (1 + 1 / r), th = rad(thetaFromL);
    const m = mL * Math.cos(th) ** 2 + mB * Math.sin(th) ** 2;
    const area = bEff * lEff, phi = rad(phiDeg);
    if (phiDeg === 0) {
      if (cohesion <= 0) throw new Error("phi = 0 analysis requires cohesion > 0.");
      return { ic: Math.max(1 - (m * h) / (area * cohesion * nc), 0), iq: 1, ig: 1, m };
    }
    const base = 1 - h / (v + (area * cohesion) / Math.tan(phi));
    if (base <= 0)
      throw new Error(`Horizontal load ${h.toFixed(1)} kN exceeds the available shear resistance; ` +
                      `the footing slides before it bears.`);
    const iq = Math.pow(base, m), ig = Math.pow(base, m + 1);
    return { ic: Math.max(iq - (1 - iq) / (nq - 1), 0), iq, ig, m };
  }

  function effectiveGamma(profile, df, b, gammaMoist) {
    // The note is QUALITATIVE and carries no numbers: the UI owns formatting
    // and knows the user's units. Embedding kN/m³ here leaks internal SI onto a
    // page displaying ksf and pcf.
    const dw = profile.waterTableDepth;
    const sub = profile.layerAt(df + b / 2).gammaBuoyant;
    if (!Number.isFinite(dw) || dw >= df + b)
      return { gamma: gammaMoist, note: "Case III — water table below the failure zone; no reduction.", belowBase: null };
    if (dw <= df)
      return { gamma: sub, note: "Case I — water table at or above the base; fully buoyant.", belowBase: 0 };
    const g = sub + ((dw - df) / b) * (gammaMoist - sub);
    return { gamma: g, note: "Case II — water table within B below the base; linearly interpolated.", belowBase: dw - df };
  }

  function averagedProperties(profile, df, b, influenceDepthRatio = 1.5) {
    const zTop = df, zBot = df + influenceDepthRatio * b;
    const warnings = [], seen = [];
    let z = zTop;
    while (z < zBot - 1e-9) {
      const layer = profile.layerAt(z);
      let end = zBot;
      for (let i = 0; i < profile.layers.length; i++)
        if (profile.layers[i] === layer) { end = Math.min(zBot, profile.layerBottom(i)); break; }
      if (end <= z) end = zBot;
      seen.push({ t: end - z, layer });
      z = end;
    }
    const totalT = seen.reduce((a, s) => a + s.t, 0);
    if (totalT <= 0) {
      const l = profile.layerAt(df);
      return { phi: l.phi, cohesion: l.cohesion, gammaMoist: l.gamma, drainage: l.drainage, warnings };
    }
    const tanPhi = seen.reduce((a, s) => a + s.t * Math.tan(rad(s.layer.phi)), 0) / totalT;
    const cohesion = seen.reduce((a, s) => a + s.t * s.layer.cohesion, 0) / totalT;
    const gamma = seen.reduce((a, s) => a + s.t * s.layer.gamma, 0) / totalT;

    const drainages = new Set(seen.map(s => s.layer.drainage));
    let drainage;
    if (drainages.size > 1) {
      warnings.push("The bearing failure zone spans both drained and undrained layers. " +
        "Averaged properties are NOT a valid substitute for checking each condition separately — " +
        "run the drained and undrained cases as two analyses and take the lower capacity.");
      drainage = drainages.has("undrained") ? "undrained" : "drained";
    } else drainage = [...drainages][0];

    if (seen.length > 1) {
      const strength = l => l.cohesion + 50.0 * Math.tan(rad(l.phi));
      const vals = seen.map(s => strength(s.layer));
      const lo = Math.min(...vals), hi = Math.max(...vals);
      if (lo > 0 && hi / lo > 1.5) {
        const top = seen[0].layer;
        const weakest = seen.reduce((a, s) => strength(s.layer) < strength(a.layer) ? s : a).layer;
        const strongest = seen.reduce((a, s) => strength(s.layer) > strength(a.layer) ? s : a).layer;
        if (weakest !== top)
          warnings.push(`Strong layer (${top.name}) over weaker layer (${weakest.name}) within the ` +
            `failure zone. The averaged solution is UNCONSERVATIVE here; a punching-shear check ` +
            `(Meyerhof & Hanna 1978) is required.`);
        else if (strongest !== top)
          warnings.push(`Weak layer (${top.name}) over stronger layer (${strongest.name}) within the ` +
            `failure zone. Averaging is conservative but crude; consider founding on the deeper stratum.`);
      }
    }
    return {
      phi: drainage === "undrained" ? 0 : deg(Math.atan(tanPhi)),
      cohesion, gammaMoist: gamma, drainage, warnings,
    };
  }

  function slidingResistance(v, bEff, lEff, phi, cohesion, interfaceFactor = 0.67) {
    return v * Math.tan(rad(interfaceFactor * phi)) +
           Math.min(cohesion, interfaceFactor * cohesion) * bEff * lEff;
  }

  function ultimateBearingCapacity(o) {
    const { profile, b, l, df, v } = o;
    const h = o.h || 0, mB = o.mB || 0, mL = o.mL || 0;
    const fs = o.factorOfSafety === undefined ? 3.0 : o.factorOfSafety;
    const method = o.method || "vesic";
    const idr = o.influenceDepthRatio === undefined ? 1.5 : o.influenceDepthRatio;
    const thetaFromL = o.thetaFromL === undefined ? 90 : o.thetaFromL;

    if (b <= 0 || l <= 0) throw new Error("Footing dimensions must be positive.");
    if (df < 0) throw new Error("Founding depth must be >= 0.");
    if (v <= 0) throw new Error("Vertical load must be > 0.");
    if (fs <= 1.0) throw new Error("Factor of safety must exceed 1.0.");

    const warnings = [];
    const eB = Math.abs(mB) / v, eL = Math.abs(mL) / v;
    if (eB >= b / 2 || eL >= l / 2)
      throw new Error(`Eccentricity exceeds half the footing dimension ` +
        `(e_B/B = ${(eB / b).toFixed(3)}, e_L/L = ${(eL / l).toFixed(3)}). The footing overturns.`);
    if (eB > b / 6 + 1e-12 || eL > l / 6 + 1e-12)
      warnings.push(`Resultant falls outside the kern (e_B/B = ${(eB / b).toFixed(3)}, ` +
        `e_L/L = ${(eL / l).toFixed(3)} vs 1/6 = 0.167). Bearing pressure distribution is ` +
        `triangular with uplift at one edge; confirm the structural design accounts for partial contact.`);

    const bRaw = b - 2 * eB, lRaw = l - 2 * eL;
    const bEff = Math.min(bRaw, lRaw), lEff = Math.max(bRaw, lRaw);

    const props = averagedProperties(profile, df, b, idr);
    warnings.push(...props.warnings);
    const { phi, cohesion, drainage } = props;

    const stress = profile.stressAt(df);
    const surcharge = drainage === "undrained" ? stress.total : stress.effective;

    const f = bearingFactors(phi, method);
    const sh = shapeFactors(bEff, lEff, phi, f.nq, f.nc);
    const dp = depthFactors(df, b, phi);
    const inc = inclinationFactors(v, h, bEff, lEff, phi, cohesion, f.nc, f.nq, thetaFromL);
    const eg = effectiveGamma(profile, df, b, props.gammaMoist);

    const termC = cohesion * f.nc * sh.sc * dp.dc * inc.ic;
    const termQ = surcharge * f.nq * sh.sq * dp.dq * inc.iq;
    const termG = 0.5 * eg.gamma * bEff * f.ngamma * sh.sg * dp.dg * inc.ig;
    const qUlt = termC + termQ + termG;

    if (!profile.extendsBelow(df + idr * b))
      warnings.push(`Boring terminates at ${profile.totalDepth.toFixed(2)} m but the bearing failure ` +
        `zone extends to ${(df + idr * b).toFixed(2)} m. The bottom layer has been extrapolated — ` +
        `verify with a deeper boring.`);

    return {
      qUlt, qNetUlt: qUlt - surcharge, qAllow: qUlt / fs,
      factorOfSafety: fs, b, l, bEff, lEff, df, cohesion, phi,
      surchargeQ: surcharge, gammaE: eg.gamma, drainage, factors: f,
      ...sh, ...dp, ...inc, kDepth: dp.k, mIncl: inc.m,
      termCohesion: termC, termSurcharge: termQ, termSelfWeight: termG,
      gwNote: eg.note, gwBelowBase: eg.belowBase, warnings,
    };
  }

  // ---- settlement ---------------------------------------------------------
  function schmertmannGeometry(lOverB) {
    const t = Math.min(1.0, Math.log10(Math.max(lOverB, 1.0)));
    return { iz0: 0.1 + 0.1 * t, zp: 0.5 + 0.5 * t, zmax: 2.0 + 2.0 * t };
  }
  function strainInfluence(zOverB, iz0, zp, zmax, izp) {
    if (zOverB <= 0) return iz0;
    if (zOverB >= zmax) return 0;
    if (zOverB <= zp) return iz0 + (izp - iz0) * (zOverB / zp);
    return (izp * (zmax - zOverB)) / (zmax - zp);
  }

  function sublayerGrid(profile, df, zBottom, target, forced = []) {
    const bounds = new Set([df, zBottom]);
    for (const z of forced) if (z > df && z < zBottom) bounds.add(z);
    for (let i = 0; i < profile.layers.length; i++)
      for (const z of [profile.layerTop(i), profile.layerBottom(i)])
        if (z > df && z < zBottom) bounds.add(z);
    const ordered = [...bounds].sort((a, b) => a - b);   // numeric, not lexicographic
    const out = [];
    for (let i = 0; i < ordered.length - 1; i++) {
      const a = ordered[i], bnd = ordered[i + 1];
      const n = Math.max(1, Math.ceil((bnd - a) / target));
      const step = (bnd - a) / n;
      for (let k = 0; k < n; k++) out.push([a + k * step, a + (k + 1) * step]);
    }
    return out;
  }

  function settlement(o) {
    const { profile, b, l, df, qGross } = o;
    const timeYears = o.timeYears === undefined ? 50.0 : o.timeYears;
    const creep = o.creep === undefined ? true : o.creep;
    const poisson = o.poisson === undefined ? 0.3 : o.poisson;
    if (b <= 0 || l <= 0) throw new Error("Footing dimensions must be positive.");
    if (timeYears <= 0) throw new Error("Design life must be > 0 years.");

    const warnings = [];
    const sigmaV0 = profile.effectiveStress(df);
    const netQ = qGross - sigmaV0;
    if (netQ <= 0)
      return { total: 0, immediate: 0, consolidation: 0, c1: 1, c2: 1,
        netPressure: netQ, sigmaV0Base: sigmaV0, izp: 0, zpOverB: 0, zmaxOverB: 0, sublayers: [],
        warnings: ["Net bearing pressure is zero or negative (full compensation); settlement " +
                   "taken as zero. Check heave and rebound separately."] };

    const geo = schmertmannGeometry(l / b);
    const sigmaZp = profile.effectiveStress(df + geo.zp * b);
    const izp = 0.5 + 0.1 * Math.sqrt(netQ / Math.max(sigmaZp, 1e-6));
    const c1 = Math.max(0.5, 1 - 0.5 * (sigmaV0 / netQ));
    const c2 = creep ? 1 + 0.2 * Math.log10(timeYears / 0.1) : 1.0;

    const zBottom = Math.max(df + geo.zmax * b,
                             df + Math.max(influenceDepth(b, l, netQ, 0.10), 0.01));
    if (!profile.extendsBelow(zBottom))
      warnings.push(`Settlement summation extends to ${zBottom.toFixed(2)} m but the boring ends at ` +
        `${profile.totalDepth.toFixed(2)} m. The bottom layer has been extrapolated; settlement may ` +
        `be underestimated if softer material exists below.`);

    const grid = sublayerGrid(profile, df, zBottom, Math.max(b / 10, 0.05),
                              [df + geo.zp * b, df + geo.zmax * b]);
    let immediate = 0, consol = 0, schmertmannSum = 0;
    const subs = [];

    for (const [zTop, zBot] of grid) {
      const thickness = zBot - zTop, zMid = 0.5 * (zTop + zBot);
      const layer = profile.layerAt(zMid), dzBelow = zMid - df;
      if (layer.drainage === "drained") {
        if (dzBelow > geo.zmax * b) continue;
        const iz = strainInfluence(dzBelow / b, geo.iz0, geo.zp, geo.zmax, izp);
        let es = layer.elasticModulus;
        if (es === null || es === undefined) {
          if (layer.sptN === null || layer.sptN === undefined)
            throw new Error(`Layer "${layer.name}": settlement needs either an elastic modulus or an SPT N value.`);
          es = esFromSpt(layer.sptN, layer.energyRatio, layer.soilClass);
          warnings.push(`Layer "${layer.name}": Es correlated from N = ${layer.sptN} as ` +
            `${(es / P_ATM_KPA).toFixed(0)} × atmospheric pressure, assuming soil class ` +
            `"${layer.soilClass}" (Kulhawy & Mayne 1990). Scatter is roughly a factor of 2 ` +
            `— confirm with CPT or lab data.`);
          layer.elasticModulus = es;
        }
        if (es <= 0) throw new Error(`Layer "${layer.name}": elastic modulus must be > 0.`);
        schmertmannSum += (iz / es) * thickness;
        subs.push({ zTop, zBot, layerName: layer.name, method: "Schmertmann", iz, es,
                    deltaSigma: boussinesqCenter(netQ, b, l, dzBelow),
                    sigma0: profile.effectiveStress(zMid), settlement: 0 });
      } else {
        const sigma0 = profile.effectiveStress(zMid);
        const dsig = boussinesqCenter(netQ, b, l, dzBelow);
        if (dsig < 0.01 * netQ) continue;
        const sigmaP = layer.ocr * sigma0, sigmaF = sigma0 + dsig;
        if (!(layer.cc > 0 && layer.e0 > 0)) {
          warnings.push(`Layer "${layer.name}" is cohesive but has no Cc/e0; its consolidation ` +
            `settlement is NOT included. Supply Cc and e0 or the total settlement is unconservative.`);
          continue;
        }
        const cc = layer.cc, cr = (layer.cr === null || layer.cr === undefined) ? cc / 6 : layer.cr;
        let s = 0;
        if (sigmaF <= sigmaP) s = (thickness * cr / (1 + layer.e0)) * Math.log10(sigmaF / sigma0);
        else {
          if (sigmaP > sigma0) s += (thickness * cr / (1 + layer.e0)) * Math.log10(sigmaP / sigma0);
          s += (thickness * cc / (1 + layer.e0)) * Math.log10(sigmaF / Math.max(sigmaP, sigma0));
        }
        consol += s;
        let si = 0;
        if (layer.elasticModulus) { si = dsig * (1 - poisson ** 2) * thickness / layer.elasticModulus; immediate += si; }
        subs.push({ zTop, zBot, layerName: layer.name, method: "Consolidation", sigma0,
                    deltaSigma: dsig, sigmaP, es: layer.elasticModulus || 0, settlement: s + si });
      }
    }

    const sSchmertmann = c1 * c2 * netQ * schmertmannSum;
    for (const r of subs)
      if (r.method === "Schmertmann") r.settlement = c1 * c2 * netQ * (r.iz / r.es) * (r.zBot - r.zTop);
    immediate += sSchmertmann;

    return { total: immediate + consol, immediate, consolidation: consol, c1, c2,
      netPressure: netQ, sigmaV0Base: sigmaV0, izp, zpOverB: geo.zp, zmaxOverB: geo.zmax,
      sublayers: subs, warnings: [...new Set(warnings)] };
  }

  // ---- design codes -------------------------------------------------------
  const CODES = {
    us_asd: {
      key: "us_asd", name: "United States", subtitle: "Allowable Stress Design",
      approach: "ASD", factorOfSafety: 3.0, factorOfSafetySliding: 1.5,
      settlementLimit: 0.0254, combinations: [],
      citation: "IBC / ASCE 7 allowable stress design; factor of safety per customary practice",
      notes: [
        "FS = 3.0 on ultimate bearing capacity is customary US geotechnical practice for sustained (dead plus live) loading. It is NOT a value the IBC prescribes — IBC Chapter 18 gives presumptive load-bearing values rather than a factor of safety. The project geotechnical report governs.",
        "Where a load combination includes wind or seismic, US practice commonly permits a reduced factor of safety (or the equivalent one-third increase in allowable pressure). This tool does not apply that automatically — set the factor of safety deliberately for the case you are checking.",
        "Bearing capacity and settlement are both checked at SERVICE (unfactored) load. Do not enter factored loads.",
      ],
    },
    canada_lsd: {
      key: "canada_lsd", name: "Canada", subtitle: "Limit States Design",
      approach: "LSD", resistanceFactor: 0.5, resistanceFactorSliding: 0.8,
      settlementLimit: 0.025,
      combinations: [{ name: "1.4D", dead: 1.4, live: 0.0 },
                     { name: "1.25D + 1.5L", dead: 1.25, live: 1.5 }],
      counteracting: { name: "0.9D + 1.5L", dead: 0.9, live: 1.5 },
      citation: "NBC 2020 Part 4 limit states design; geotechnical resistance factors after the Canadian Foundation Engineering Manual",
      notes: [
        "Geotechnical resistance factor Φ = 0.5 for bearing resistance of shallow foundations at ULS, and 0.8 for sliding, follow the Canadian Foundation Engineering Manual. Confirm against the edition your jurisdiction adopts.",
        "Load combinations are NBC 2020 Table 4.1.3.2 reduced to the dead and live cases: 1.4D and 1.25D + 1.5L. A full design must also consider snow, wind and seismic combinations, which this tool does not form.",
        "Provinces amend the NBC. Ontario (OBC), British Columbia, Alberta and Quebec all publish their own editions; verify factors and combinations against the code actually in force for the site.",
        "Serviceability (settlement) is checked at UNFACTORED load. Only the ULS bearing check uses factored loads.",
      ],
    },
  };
  const factored = (combo, d, l) => combo.dead * d + combo.live * l;
  function governingCombination(code, d, l) {
    if (!code.combinations.length)
      throw new Error(`${code.name} is an ${code.approach} framework and has no ULS load combinations.`);
    let best = code.combinations[0];
    for (const c of code.combinations) if (factored(c, d, l) > factored(best, d, l)) best = c;
    return { combo: best, value: factored(best, d, l) };
  }

  // ---- design solver ------------------------------------------------------
  const estimateThickness = (b, columnB) =>
    Math.max(0.30, Math.ceil(((b - columnB) / 2 * 0.5) / 0.05) * 0.05);
  const grossPressure = (v, b, l, df, t, gammaSoil) =>
    v / (b * l) + t * GAMMA_CONCRETE + Math.max(0, df - t) * gammaSoil;

  function designFooting(profile, load, criteria) {
    const c = criteria, code = c.code;
    const df = load.embedment !== undefined && load.embedment !== null ? load.embedment : c.minEmbedment;
    if (df < c.minEmbedment)
      throw new Error(`${load.mark}: embedment is less than the required minimum.`);
    const v = load.dead + load.live;
    if (!(v > 0)) throw new Error(`${load.mark}: total service vertical load must be > 0.`);
    const props = averagedProperties(profile, df, c.minWidth, c.influenceDepthRatio);
    const gammaSoil = props.gammaMoist;

    function evaluate(b) {
      const l = b * c.aspectRatio, t = estimateThickness(b, load.columnB), area = b * l;
      const qService = grossPressure(v, b, l, df, t, gammaSoil);
      const selfWeight = t * GAMMA_CONCRETE + Math.max(0, df - t) * gammaSoil;

      let qDemand, comboLabel, deadFactor;
      if (code.approach === "ASD") {
        qDemand = qService; comboLabel = "service (D + L)"; deadFactor = 1.0;
      } else {
        const g = governingCombination(code, load.dead, load.live);
        qDemand = g.value / area + g.combo.dead * selfWeight;
        comboLabel = g.combo.name; deadFactor = g.combo.dead;
      }
      const vTotal = qDemand * area;
      const scale = code.approach === "LSD" ? deadFactor : 1.0;
      const mB = (load.momentB || 0) * scale, mL = (load.momentL || 0) * scale;
      const hUls = (load.horizontal || 0) * scale;

      let br;
      try {
        br = ultimateBearingCapacity({ profile, b, l, df, v: vTotal, h: hUls, mB, mL,
          factorOfSafety: c.factorOfSafetyBearing, method: c.bearingMethod,
          influenceDepthRatio: c.influenceDepthRatio });
      } catch (e) { return { design: null, reason: e.message }; }

      let capacity, factorLabel;
      if (code.approach === "ASD") {
        capacity = br.qAllow; factorLabel = `FS = ${c.factorOfSafetyBearing}`;
      } else {
        const phi = c.resistanceFactorBearing || code.resistanceFactor;
        capacity = phi * br.qUlt; factorLabel = `Φ = ${phi}`;
      }
      const lambda = qService > 0 ? qDemand / qService : 1.0;
      const uls = { approach: code.approach, demand: qDemand, capacity, combination: comboLabel,
        factorLabel, qUlt: br.qUlt, qService, loadFactorRatio: lambda,
        utilisation: capacity > 0 ? qDemand / capacity : Infinity,
        equivalentGlobalFs: capacity > 0 ? (br.qUlt * lambda) / capacity : Infinity,
        ok: qDemand <= capacity };

      const st = settlement({ profile, b, l, df, qGross: qService, timeYears: c.timeYears });
      const settleUtil = st.total / c.settlementLimit;
      const settleOk = st.total <= c.settlementLimit;

      let slidingFs = null, slidingOk = true;
      if (load.horizontal > 0) {
        if (code.approach === "LSD") {
          const cc = code.counteracting;
          const vResist = (factored(cc, load.dead, load.live) / area + cc.dead * selfWeight) * area;
          const phiSlide = code.resistanceFactorSliding || 0.8;
          slidingFs = (phiSlide * slidingResistance(vResist, br.bEff, br.lEff, br.phi, br.cohesion)) / hUls;
          slidingOk = slidingFs >= 1.0;
        } else {
          slidingFs = slidingResistance(vTotal, br.bEff, br.lEff, br.phi, br.cohesion) / load.horizontal;
          slidingOk = slidingFs >= c.factorOfSafetySliding;
        }
      }
      let overturningOk = true;
      if (mB || mL) {
        const mOvt = Math.abs(mB) + hUls * df;
        if (mOvt > 0) overturningOk = (vTotal * b / 2) / mOvt >= c.factorOfSafetyOverturning;
      }
      let governing = uls.utilisation >= settleUtil ? "Bearing capacity" : "Settlement";
      if (!slidingOk) governing = "Sliding"; else if (!overturningOk) governing = "Overturning";

      return { design: {
        mark: load.mark, ok: uls.ok && settleOk && slidingOk && overturningOk,
        b, l, df, thickness: t, governing, qApplied: qDemand, qAllow: capacity,
        qService, bearingUtilisation: uls.utilisation, totalSettlement: st.total,
        settlementUtilisation: settleUtil, slidingFs, concreteVolume: b * l * t,
        bearing: br, settlementResult: st, uls,
        warnings: [...br.warnings, ...st.warnings],
      }, reason: "" };
    }

    const nSteps = Math.floor((c.maxWidth - c.minWidth) / c.sizeIncrement) + 1;
    const trials = [];
    let firstOk = null, lastFail = "";
    for (let i = 0; i < nSteps; i++) {
      const b = c.minWidth + i * c.sizeIncrement;
      if (b > c.maxWidth + 1e-9) break;
      const { design, reason } = evaluate(b);
      if (!design) { lastFail = reason; continue; }
      trials.push(design);
      if (design.ok) { firstOk = design; break; }
    }
    if (firstOk === null)
      return { mark: load.mark, ok: false, df, governing: "NO SOLUTION", b: 0,
               message: diagnose(load, c, trials, lastFail, evaluate), warnings: [] };
    checkMonotonic(evaluate, c, firstOk);
    return firstOk;
  }

  function probeBeyond(evaluate, c, trials) {
    const r = { solutionB: null, bestB: 0, bestSettlement: Infinity, maxProbed: c.maxWidth };
    for (const d of trials)
      if (d.totalSettlement < r.bestSettlement) { r.bestSettlement = d.totalSettlement; r.bestB = d.b; }
    for (const factor of [1.25, 1.5, 2.0, 3.0]) {
      const b = c.maxWidth * factor;
      r.maxProbed = b;
      const { design } = evaluate(b);
      if (!design) continue;
      if (design.totalSettlement < r.bestSettlement) { r.bestSettlement = design.totalSettlement; r.bestB = b; }
      if (design.ok && r.solutionB === null) { r.solutionB = b; break; }
    }
    if (!Number.isFinite(r.bestSettlement)) r.bestSettlement = 0;
    return r;
  }

  function checkMonotonic(evaluate, c, result) {
    for (const step of [1, 2, 4, 8]) {
      const b = result.b + step * c.sizeIncrement;
      if (b > c.maxWidth) break;
      const { design } = evaluate(b);
      if (!design) continue;
      if (design.totalSettlement > c.settlementLimit) {
        result.warnings.push(`Non-monotonic settlement: enlarging the footing to B = ${b.toFixed(2)} m ` +
          `INCREASES settlement to ${(design.totalSettlement * 1000).toFixed(1)} mm, exceeding the ` +
          `${(c.settlementLimit * 1000).toFixed(0)} mm limit. A deeper compressible stratum is being ` +
          `stressed. Do not size this footing by inspection.`);
        break;
      }
    }
  }

  function diagnose(load, c, trials, lastFail, evaluate) {
    const u = c.units || units("SI");
    const ln = v => `${u.fromLength(v).toFixed(2)} ${u.labels.length}`;
    const st = v => `${u.fromSettle(v).toFixed(3)} ${u.labels.small}`;
    const head = `No footing between ${ln(c.minWidth)} and ${ln(c.maxWidth)} satisfies the criteria for ${load.mark}.`;
    if (!trials.length) return `${head} The solver could not evaluate any trial size. ${lastFail}`.trim();

    const worst = trials[trials.length - 1];
    const parts = [head,
      `At the largest size tried (B = ${ln(worst.b)}) bearing utilisation is ` +
      `${worst.bearingUtilisation.toFixed(2)} and settlement utilisation is ${worst.settlementUtilisation.toFixed(2)}.`];

    if (worst.settlementUtilisation > 1.0) {
      const sr = worst.settlementResult;
      const share = sr && sr.total > 0 ? sr.consolidation / sr.total : 0;
      if (share > 0.5) {
        const byLayer = {};
        for (const s of sr.sublayers)
          if (s.method === "Consolidation") byLayer[s.layerName] = (byLayer[s.layerName] || 0) + s.settlement;
        const culprit = Object.keys(byLayer).reduce((a, k) => byLayer[k] > (byLayer[a] || -1) ? k : a,
                                                    Object.keys(byLayer)[0] || "a cohesive stratum");
        parts.push(`Settlement governs: ${st(worst.totalSettlement)} against a limit of ` +
          `${st(c.settlementLimit)}, and ${(share * 100).toFixed(0)}% of it is consolidation in "${culprit}".`);
      } else {
        parts.push(`Settlement governs: ${st(worst.totalSettlement)} against a limit of ${st(c.settlementLimit)}.`);
      }
      const probe = probeBeyond(evaluate, c, trials);
      if (probe.solutionB !== null)
        parts.push(`Probing past the search range: a footing DOES work at B = ${ln(probe.solutionB)}. ` +
          `Raise the maximum width to at least that and re-run, then weigh the extra excavation and ` +
          `concrete against ground improvement.`);
      else
        parts.push(`Probing out to ${ln(probe.maxProbed)} found no working size. The least settlement at ` +
          `ANY width tried is ${st(probe.bestSettlement)} at B = ${ln(probe.bestB)}, still above the ` +
          `${st(c.settlementLimit)} limit. Widening cannot solve this: a wider footing pushes its stress ` +
          `bulb deeper into the compressible stratum, cancelling the lower contact pressure. The real ` +
          `options are ground improvement, a mat, or deep foundations — or confirming with the ` +
          `structural engineer whether ${st(probe.bestSettlement)} is tolerable.`);
    } else {
      parts.push("Bearing capacity governs. Founding deeper reaches stronger material and raises " +
        "capacity faster than widening does.");
    }
    if (lastFail) parts.push(`Solver note: ${lastFail}`);
    return parts.join(" ");
  }

  return { FT_TO_M, KIP_TO_KN, KSF_TO_KPA, PCF_TO_KNM3, P_ATM_KPA, GAMMA_WATER,
    GAMMA_CONCRETE, ALPHA_E, units, makeLayer, makeProfile, n60, overburdenFactor,
    phiFromSpt, esFromSpt, newmarkCorner, boussinesqCenter, influenceDepth,
    bearingFactors, shapeFactors, depthFactors, inclinationFactors, effectiveGamma,
    averagedProperties, slidingResistance, ultimateBearingCapacity,
    schmertmannGeometry, strainInfluence, settlement, CODES, governingCombination,
    estimateThickness, grossPressure, designFooting };
})();</script>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- state: values are held in USER units, converted at the engine edge ----
  const EXAMPLE_US = {
    units: "US", code: "us_asd",
    load: { dead: 150, live: 75, horizontal: 0, moment: 0, columnB: 1.33, embedment: 2.0 },
    waterTable: 12,
    layers: [
      { name: "Sandy fill", thickness: 4, gamma: 115, gammaSat: 122, drainage: "drained",
        sptN: 15, phi: "", soilClass: "clean_sand_nc", es: "" },
      { name: "Stiff clay", thickness: 11, gamma: 126, gammaSat: 130, drainage: "undrained",
        cohesion: 3.0, es: 700, cc: 0.18, cr: 0.028, e0: 0.70, ocr: 4.0 },
      { name: "Dense sand", thickness: 30, gamma: 130, gammaSat: 136, drainage: "drained",
        sptN: 40, phi: "", soilClass: "clean_sand_nc", es: "" },
    ],
    criteria: { settlement: 1.0, factor: 3.0, maxWidth: 16, increment: 0.25, aspect: 1.0, method: "vesic" },
  };
  let S = JSON.parse(JSON.stringify(EXAMPLE_US));

  // ---- unit conversion of the whole state, so switching keeps one problem ----
  function convertState(from, to) {
    if (from === to) return;
    const A = Burh.units(from), B = Burh.units(to);
    const L = v => v === "" || v == null ? v : round(B.fromLength(A.toLength(+v)), 4);
    const F = v => v === "" || v == null ? v : round(B.fromForce(A.toForce(+v)), 3);
    const P = v => v === "" || v == null ? v : round(B.fromStress(A.toStress(+v)), 4);
    const W = v => v === "" || v == null ? v : round(B.fromUnitWeight(A.toUnitWeight(+v)), 3);
    const M = v => v === "" || v == null ? v : round(B.fromMoment(A.toMoment(+v)), 3);
    const T = v => v === "" || v == null ? v : round(B.fromSettle(A.toSettle(+v)), 4);
    S.load.dead = F(S.load.dead); S.load.live = F(S.load.live);
    S.load.horizontal = F(S.load.horizontal); S.load.moment = M(S.load.moment);
    S.load.columnB = L(S.load.columnB); S.load.embedment = L(S.load.embedment);
    S.waterTable = L(S.waterTable);
    S.criteria.settlement = T(S.criteria.settlement);
    S.criteria.maxWidth = L(S.criteria.maxWidth);
    S.criteria.increment = L(S.criteria.increment);
    for (const l of S.layers) {
      l.thickness = L(l.thickness); l.gamma = W(l.gamma); l.gammaSat = W(l.gammaSat);
      if (l.cohesion !== undefined) l.cohesion = P(l.cohesion);
      if (l.es !== undefined) l.es = P(l.es);
    }
  }
  const round = (v, n) => Math.round(v * 10 ** n) / 10 ** n;
  const num = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;

  // ---- build engine inputs -------------------------------------------------
  function build() {
    const U = Burh.units(S.units);
    const code = Burh.CODES[S.code];
    const layers = S.layers.map(l => {
      const base = {
        name: l.name || "Layer", thickness: U.toLength(+l.thickness || 0.01),
        gamma: U.toUnitWeight(+l.gamma || 18),
        gammaSat: num(l.gammaSat) === null ? null : U.toUnitWeight(+l.gammaSat),
        drainage: l.drainage,
        elasticModulus: num(l.es) === null ? null : U.toStress(+l.es),
      };
      if (l.drainage === "undrained")
        Object.assign(base, { phi: 0, cohesion: U.toStress(+l.cohesion || 0),
          cc: num(l.cc), cr: num(l.cr), e0: num(l.e0), ocr: num(l.ocr) || 1 });
      else
        Object.assign(base, { phi: num(l.phi) === null ? 0 : +l.phi, cohesion: 0,
          sptN: num(l.sptN), soilClass: l.soilClass || "clean_sand_nc" });
      return Burh.makeLayer(base);
    });
    const profile = Burh.makeProfile(layers,
      num(S.waterTable) === null ? Infinity : U.toLength(+S.waterTable));

    // Infer phi for granular layers that gave an SPT N but no friction angle.
    const inferred = [];
    layers.forEach((l, i) => {
      if (l.drainage !== "drained" || l.phi > 0 || l.sptN == null) return;
      const zMid = profile.layerTop(i) + l.thickness / 2;
      const r = Burh.phiFromSpt(l.sptN, profile.effectiveStress(zMid), l.energyRatio);
      l.phi = r.phi;
      inferred.push(`${l.name}: φ′ = ${r.phi.toFixed(1)}° ESTIMATED from N = ${l.sptN} per ${r.cite}.`);
    });

    const c = S.criteria;
    const criteria = {
      code, units: U,
      factorOfSafetyBearing: code.approach === "ASD" ? (num(c.factor) || 3) : 3,
      resistanceFactorBearing: code.approach === "LSD" ? (num(c.factor) || code.resistanceFactor) : null,
      factorOfSafetySliding: 1.5, factorOfSafetyOverturning: 2.0,
      settlementLimit: U.toSettle(+c.settlement || 25),
      minWidth: U.toLength(S.units === "US" ? 2.0 : 0.6),
      maxWidth: U.toLength(+c.maxWidth || 6),
      sizeIncrement: U.toLength(+c.increment || 0.05),
      minEmbedment: U.toLength(+S.load.embedment || 0.45),
      aspectRatio: Math.max(1, num(c.aspect) || 1),
      bearingMethod: c.method, timeYears: 50, influenceDepthRatio: 1.5,
    };
    const load = {
      mark: "F-1", dead: U.toForce(+S.load.dead || 0), live: U.toForce(+S.load.live || 0),
      horizontal: U.toForce(+S.load.horizontal || 0),
      momentB: U.toMoment(+S.load.moment || 0), momentL: 0,
      columnB: U.toLength(+S.load.columnB || 0.4), columnL: U.toLength(+S.load.columnB || 0.4),
      embedment: U.toLength(+S.load.embedment || 0.45),
    };
    return { U, code, profile, criteria, load, inferred };
  }

  // ---- rendering -----------------------------------------------------------
  function renderCodes() {
    $("codes").innerHTML = Object.values(Burh.CODES).map(c => `
      <button type="button" class="code-btn" data-code="${c.key}" aria-pressed="${c.key === S.code}">
        <div class="n">${esc(c.name)}</div>
        <div class="s">${esc(c.subtitle)}</div>
        <div class="f">${c.approach === "ASD"
          ? `FS on q<sub>ult</sub> &middot; service load`
          : `&Phi; on q<sub>ult</sub> &middot; factored load`}</div>
      </button>`).join("");
  }

  function renderLayers() {
    const U = Burh.units(S.units), lab = U.labels;
    $("layers").innerHTML = S.layers.map((l, i) => {
      const coh = l.drainage === "undrained";
      return `<div class="layer ${coh ? "cohesive" : ""}">
        <div class="layer-head">
          <input data-li="${i}" data-f="name" value="${esc(l.name)}" aria-label="Layer name">
          <button class="icon-btn" type="button" data-del="${i}" aria-label="Remove layer" title="Remove layer">&times;</button>
        </div>
        <div class="grid g3">
          <div><label>Thickness ${lab.length}</label><input type="number" step="any" data-li="${i}" data-f="thickness" value="${l.thickness}"></div>
          <div><label><span class="g">&gamma;</span> ${lab.unitWeight}</label><input type="number" step="any" data-li="${i}" data-f="gamma" value="${l.gamma}"></div>
          <div><label><span class="g">&gamma;</span><sub>sat</sub></label><input type="number" step="any" data-li="${i}" data-f="gammaSat" value="${l.gammaSat ?? ""}"></div>
        </div>
        <div class="grid g3" style="margin-top:8px">
          <div><label>Analysis</label>
            <select data-li="${i}" data-f="drainage">
              <option value="drained" ${!coh ? "selected" : ""}>Drained</option>
              <option value="undrained" ${coh ? "selected" : ""}>Undrained</option>
            </select></div>
          ${coh ? `
          <div><label>s<sub>u</sub> ${lab.stress}</label><input type="number" step="any" data-li="${i}" data-f="cohesion" value="${l.cohesion ?? ""}"></div>
          <div><label>E<sub>s</sub> ${lab.stress}</label><input type="number" step="any" data-li="${i}" data-f="es" value="${l.es ?? ""}"></div>
          </div><div class="grid g4" style="margin-top:8px">
          <div><label>C<sub>c</sub></label><input type="number" step="any" data-li="${i}" data-f="cc" value="${l.cc ?? ""}"></div>
          <div><label>C<sub>r</sub></label><input type="number" step="any" data-li="${i}" data-f="cr" value="${l.cr ?? ""}"></div>
          <div><label>e<sub>0</sub></label><input type="number" step="any" data-li="${i}" data-f="e0" value="${l.e0 ?? ""}"></div>
          <div><label>OCR</label><input type="number" step="any" data-li="${i}" data-f="ocr" value="${l.ocr ?? 1}"></div>`
          : `
          <div><label>SPT N</label><input type="number" step="any" data-li="${i}" data-f="sptN" value="${l.sptN ?? ""}"></div>
          <div><label><span class="g">&phi;</span>&prime; deg <span style="text-transform:none">(blank = from N)</span></label><input type="number" step="any" data-li="${i}" data-f="phi" value="${l.phi ?? ""}"></div>
          </div><div class="grid g2" style="margin-top:8px">
          <div><label>Sand class</label>
            <select data-li="${i}" data-f="soilClass">
              <option value="clean_sand_nc" ${l.soilClass === "clean_sand_nc" ? "selected" : ""}>Clean, NC</option>
              <option value="clean_sand_oc" ${l.soilClass === "clean_sand_oc" ? "selected" : ""}>Clean, OC</option>
              <option value="sand_with_fines" ${l.soilClass === "sand_with_fines" ? "selected" : ""}>With fines</option>
            </select></div>
          <div><label>E<sub>s</sub> ${lab.stress} <span style="text-transform:none">(blank = from N)</span></label><input type="number" step="any" data-li="${i}" data-f="es" value="${l.es ?? ""}"></div>`}
        </div>
      </div>`;
    }).join("");
  }

  function gwText(b, U) {
    let s = b.gwNote;
    if (b.gwBelowBase !== null && b.gwBelowBase > 0)
      s += ` Water table ${U.fromLength(b.gwBelowBase).toFixed(2)} ${U.labels.length} below the base.`;
    return `${s} γe = ${U.fromUnitWeight(b.gammaE).toFixed(2)} ${U.labels.unitWeight}.`;
  }

  function profileSvg(profile, U, b, df) {
    // Stratum column with the footing drawn on it, to scale. Depth axis only -
    // the footing's width is shown to the same vertical scale so the reader can
    // see how far the stress bulb reaches relative to the layers.
    const W = 300, H = 230, padT = 16, padB = 18, left = 58, right = 14;
    // Scale to the zone that matters, not the whole boring: a 45 ft boring
    // under a 2 ft deep footing squashes everything of interest into the top
    // few percent of the frame.
    const maxZ = Math.min(profile.totalDepth, Math.max(df + 3 * b, df + 2.5));
    const truncated = profile.totalDepth > maxZ + 1e-9;
    const y = z => padT + (z / maxZ) * (H - padT - padB);
    const fills = ["var(--blue-wash)", "var(--ochre-wash)", "var(--sunk)"];
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;height:auto"
      role="img" aria-label="Soil profile with the footing drawn to scale">`;
    profile.layers.forEach((l, i) => {
      const y0 = y(profile.layerTop(i)), y1 = y(Math.min(profile.layerBottom(i), maxZ));
      if (y1 <= y0) return;
      s += `<rect x="${left}" y="${y0}" width="${W - left - right}" height="${y1 - y0}"
        fill="${l.drainage === "undrained" ? "var(--ochre-wash)" : fills[i % 3]}"
        stroke="var(--rule)" stroke-width="1"/>`;
      if (y1 - y0 > 13)
        s += `<text x="${left + 7}" y="${(y0 + y1) / 2 + 4}" font-size="10.5"
          font-family="var(--body)" fill="var(--ink-soft)">${esc(l.name)}</text>`;
      s += `<text x="${left - 6}" y="${y0 + 9}" font-size="9.5" text-anchor="end"
        font-family="var(--mono)" fill="var(--ink-faint)">${U.fromLength(profile.layerTop(i)).toFixed(1)}</text>`;
    });
    // footing
    const fy = y(df), bw = Math.min((b / maxZ) * (H - padT - padB), W - left - right - 20);
    const cx = left + (W - left - right) / 2;
    const th = Math.max(5, (0.35 / maxZ) * (H - padT - padB));
    s += `<rect x="${cx - bw / 2}" y="${fy}" width="${bw}" height="${th}"
      fill="var(--blue)" opacity="0.92"/>`;
    s += `<line x1="${cx}" y1="${Math.max(2, fy - 13)}" x2="${cx}" y2="${fy}"
      stroke="var(--blue)" stroke-width="2.5"/>`;
    // influence depth 2B below base
    const zi = Math.min(df + 2 * b, maxZ);
    s += `<line x1="${cx - bw / 2 - 6}" y1="${y(zi)}" x2="${cx + bw / 2 + 6}" y2="${y(zi)}"
      stroke="var(--blue)" stroke-width="1" stroke-dasharray="4 3" opacity="0.75"/>`;
    s += `<text x="${cx + bw / 2 + 9}" y="${y(zi) + 3.5}" font-size="9"
      font-family="var(--mono)" fill="var(--blue)">2B</text>`;
    // water table
    const wt = profile.waterTableDepth;
    if (Number.isFinite(wt) && wt <= maxZ) {
      s += `<line x1="${left}" y1="${y(wt)}" x2="${W - right}" y2="${y(wt)}"
        stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="6 3"/>`;
      s += `<text x="${W - right - 3}" y="${y(wt) - 4}" font-size="9" text-anchor="end"
        font-family="var(--mono)" fill="var(--blue)">WT ${U.fromLength(wt).toFixed(1)}</text>`;
    }
    s += `<text x="4" y="${H - 5}" font-size="9" font-family="var(--mono)"
      fill="var(--ink-faint)">depth, ${U.labels.length}</text>`;
    if (truncated)
      s += `<text x="${W - right}" y="${H - 5}" font-size="9" text-anchor="end"
        font-family="var(--mono)" fill="var(--ink-faint)">boring continues to
        ${U.fromLength(profile.totalDepth).toFixed(0)}</text>`;
    s += `</svg>`;
    return s;
  }

  function render() {
    renderCodes(); renderLayers(); syncLabels();
    let ctx;
    try { ctx = build(); }
    catch (e) {
      $("result").innerHTML = `<h2>Result</h2><div class="err"><b>Input error.</b> ${esc(e.message)}</div>`;
      $("detail").innerHTML = ""; renderBasis(null); return;
    }
    const { U, code, profile, criteria, load, inferred } = ctx;
    let d;
    try { d = Burh.designFooting(profile, load, criteria); }
    catch (e) {
      $("result").innerHTML = `<h2>Result</h2><div class="err"><b>Cannot evaluate.</b> ${esc(e.message)}</div>`;
      $("detail").innerHTML = ""; renderBasis(code); return;
    }
    const lab = U.labels;

    if (!d.ok && !d.bearing) {
      $("result").innerHTML = `<h2>Result</h2>
        <div class="err"><b>No spread footing satisfies the criteria.</b><br>${esc(d.message)}</div>`;
      $("detail").innerHTML = ""; renderBasis(code); return;
    }

    const u = d.uls, st = d.settlementResult, b = d.bearing;
    const bu = u.utilisation, su = d.settlementUtilisation;
    const govBearing = d.governing === "Bearing capacity";
    const f2 = (v, n = 2) => v.toFixed(n);

    $("result").innerHTML = `
      <h2>Result <span class="hint">${esc(code.name)} &middot; ${esc(code.subtitle)}</span></h2>
      <div class="verdict ${d.ok ? "ok" : "fail"}">
        <div class="size">${f2(U.fromLength(d.b))} <small>&times;</small> ${f2(U.fromLength(d.l))}
          <small>${lab.length}</small></div>
        <div class="verdict-meta">
          <b>Governed by ${esc(d.governing)}</b><br>
          Founded ${f2(U.fromLength(d.df))} ${lab.length} below grade &middot;
          ${f2(U.fromLength(d.thickness))} ${lab.length} thick (estimate)<br>
          ${d.ok ? "Satisfies every limit state checked." : "<b>Does not satisfy the criteria.</b>"}
        </div>
      </div>
      <div class="checks">
        <div class="check ${govBearing ? "governs" : ""}">
          <div class="check-top"><span class="check-name">Ultimate &mdash; bearing</span>
            ${govBearing ? '<span class="check-badge">Governs</span>' : ""}</div>
          <div class="check-val">${f2(U.fromStress(u.demand))}<span class="op">&le;</span>${f2(U.fromStress(u.capacity))}
            <span style="font-size:12px;color:var(--ink-soft)">${lab.stress}</span></div>
          <div class="bar ${bu > 1 ? "over" : ""}"><span style="width:${Math.min(100, bu * 100).toFixed(1)}%"></span></div>
          <div class="bar-foot"><span>${(bu * 100).toFixed(0)}% utilised</span><span>${esc(u.factorLabel)}</span></div>
          <div class="basis">${u.approach === "ASD"
            ? `Service pressure vs q<sub>ult</sub>/FS. Combination: <b>${esc(u.combination)}</b>.`
            : `Factored pressure vs &Phi;&middot;q<sub>ult</sub>. Combination: <b>${esc(u.combination)}</b>
               (&lambda; = ${f2(u.loadFactorRatio, 3)}), equivalent to a global FS of
               <b>${f2(u.equivalentGlobalFs)}</b>.`}</div>
        </div>
        <div class="check ${!govBearing ? "governs" : ""}">
          <div class="check-top"><span class="check-name">Serviceability &mdash; settlement</span>
            ${!govBearing ? '<span class="check-badge">Governs</span>' : ""}</div>
          <div class="check-val">${U.fromSettle(d.totalSettlement).toFixed(3)}<span class="op">&le;</span>${U.fromSettle(criteria.settlementLimit).toFixed(3)}
            <span style="font-size:12px;color:var(--ink-soft)">${lab.small}</span></div>
          <div class="bar ${su > 1 ? "over" : ""}"><span style="width:${Math.min(100, su * 100).toFixed(1)}%"></span></div>
          <div class="bar-foot"><span>${(su * 100).toFixed(0)}% utilised</span><span>service load</span></div>
          <div class="basis">Schmertmann ${U.fromSettle(st.immediate).toFixed(3)} +
            consolidation ${U.fromSettle(st.consolidation).toFixed(3)} ${lab.small}.
            Checked at unfactored load in both codes.</div>
        </div>
      </div>
      ${d.slidingFs !== null ? `<div class="basis" style="margin-top:10px">
        <b>Sliding:</b> ${code.approach === "LSD"
          ? `factored resistance / factored load = ${f2(d.slidingFs)} (must be &ge; 1.0, &Phi; = ${code.resistanceFactorSliding})`
          : `FS = ${f2(d.slidingFs)} (required ${criteria.factorOfSafetySliding})`}</div>` : ""}`;

    const rows = (b.factors.nc * 0 === 0) ? [
      ["Cohesion", b.factors.nc, b.sc, b.dc, b.ic, b.termCohesion],
      ["Surcharge", b.factors.nq, b.sq, b.dq, b.iq, b.termSurcharge],
      ["Self weight", b.factors.ngamma, b.sg, b.dg, b.ig, b.termSelfWeight],
    ] : [];

    $("detail").innerHTML = `
      <h2>Derivation <span class="hint">every intermediate, so it can be checked</span></h2>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start">
        <div>
          <div class="tw"><table>
            <thead><tr><th>Term</th><th>N</th><th>shape s</th><th>depth d</th><th>incl. i</th>
              <th>Contribution<span style="display:block;font-weight:500;text-transform:none">(${lab.stress})</span></th></tr></thead>
            <tbody>${rows.map(r => `<tr><td class="t">${r[0]}</td><td>${r[1].toFixed(3)}</td>
              <td>${r[2].toFixed(3)}</td><td>${r[3].toFixed(3)}</td><td>${r[4].toFixed(3)}</td>
              <td>${U.fromStress(r[5]).toFixed(2)}</td></tr>`).join("")}</tbody>
            <tfoot><tr><td colspan="5">q<sub>ult</sub> gross ultimate</td>
              <td>${U.fromStress(b.qUlt).toFixed(2)}</td></tr></tfoot>
          </table></div>
          <h3>Inputs actually used</h3>
          <dl class="kv">
            <dt>Analysis</dt><dd>${esc(b.drainage)}</dd>
            <dt><span class="g">&phi;</span>&prime; zone average</dt><dd>${f2(b.phi, 1)}&deg;</dd>
            <dt>c zone average</dt><dd>${f2(U.fromStress(b.cohesion))} ${lab.stress}</dd>
            <dt>Surcharge q</dt><dd>${f2(U.fromStress(b.surchargeQ))} ${lab.stress}
              (${b.drainage === "undrained" ? "total" : "effective"})</dd>
            <dt><span class="g">&gamma;</span><sub>e</sub></dt><dd>${f2(U.fromUnitWeight(b.gammaE))} ${lab.unitWeight}</dd>
            <dt>Groundwater</dt><dd style="font-family:var(--body)">${esc(gwText(b, U))}</dd>
            <dt>Effective B&prime;</dt><dd>${f2(U.fromLength(b.bEff))} ${lab.length}</dd>
            <dt>C1 / C2</dt><dd>${st.c1.toFixed(4)} / ${st.c2.toFixed(4)}</dd>
            <dt>I<sub>zp</sub></dt><dd>${st.izp.toFixed(4)} at ${st.zpOverB.toFixed(2)}B, zero at ${st.zmaxOverB.toFixed(1)}B</dd>
          </dl>
        </div>
        <div>${profileSvg(profile, U, d.b, d.df)}</div>
      </div>
      ${(d.warnings.length || inferred.length) ? `<div class="notes">
        <h3 style="margin-top:0;color:var(--ochre)">Engineering notes &mdash; read before relying on this</h3>
        <ol>${[...inferred, ...d.warnings].map(w => `<li>${esc(w)}</li>`).join("")}</ol></div>` : ""}`;

    renderBasis(code);
  }

  function renderBasis(code) {
    if (!code) { $("basis").innerHTML = ""; return; }
    $("basis").innerHTML = `
      <p style="margin:0 0 8px;font-size:13.5px"><b>${esc(code.name)} &mdash; ${esc(code.subtitle)}.</b>
        ${esc(code.citation)}.</p>
      <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.5">
        ${code.notes.map(n => `<li style="margin:6px 0">${esc(n)}</li>`).join("")}
      </ul>`;
  }

  function syncLabels() {
    const lab = Burh.units(S.units).labels, code = Burh.CODES[S.code];
    $("uF1").textContent = lab.force; $("uF2").textContent = lab.force;
    $("uF3").textContent = lab.force; $("uM1").textContent = lab.moment;
    $("uL1").textContent = lab.length; $("uL2").textContent = lab.length;
    $("uL3").textContent = lab.length; $("uL4").textContent = lab.length;
    $("uL5").textContent = lab.length; $("uS1").textContent = lab.small;
    $("loadHint").textContent = code.approach === "ASD"
      ? "unfactored service loads" : "unfactored — the tool applies the load factors";
    $("factorLabel").innerHTML = code.approach === "ASD"
      ? "Factor of safety on q<sub>ult</sub>" : "Resistance factor &Phi; on q<sub>ult</sub>";
    for (const [id, v] of [["dead", S.load.dead], ["live", S.load.live], ["horiz", S.load.horizontal],
      ["moment", S.load.moment], ["colb", S.load.columnB], ["embed", S.load.embedment],
      ["wt", S.waterTable], ["settle", S.criteria.settlement], ["factor", S.criteria.factor],
      ["maxw", S.criteria.maxWidth], ["incr", S.criteria.increment], ["aspect", S.criteria.aspect]]) {
      const el = $(id);
      if (el && document.activeElement !== el) el.value = v ?? "";
    }
    const m = $("method"); if (m && document.activeElement !== m) m.value = S.criteria.method;
    for (const btn of document.querySelectorAll("#units button"))
      btn.setAttribute("aria-pressed", String(btn.dataset.u === S.units));
  }

  // ---- events --------------------------------------------------------------
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.li !== undefined) {
      const l = S.layers[+t.dataset.li];
      l[t.dataset.f] = t.type === "number" ? (t.value === "" ? "" : t.value) : t.value;
      if (t.dataset.f === "drainage") { renderLayers(); }
      render(); return;
    }
    const map = { dead: "load.dead", live: "load.live", horiz: "load.horizontal",
      moment: "load.moment", colb: "load.columnB", embed: "load.embedment",
      wt: "waterTable", settle: "criteria.settlement", factor: "criteria.factor",
      maxw: "criteria.maxWidth", incr: "criteria.increment", aspect: "criteria.aspect",
      method: "criteria.method" };
    const path = map[t.id];
    if (!path) return;
    const [a, bKey] = path.split(".");
    if (bKey) S[a][bKey] = t.value === "" ? "" : t.value; else S[a] = t.value === "" ? "" : t.value;
    render();
  });
  document.addEventListener("change", e => {
    if (e.target.id === "method" || e.target.dataset.f === "drainage"
        || e.target.dataset.f === "soilClass") render();
  });
  document.addEventListener("click", e => {
    const codeBtn = e.target.closest("[data-code]");
    if (codeBtn) {
      S.code = codeBtn.dataset.code;
      const code = Burh.CODES[S.code];
      const wantUnits = S.code === "canada_lsd" ? "SI" : "US";
      if (wantUnits !== S.units) { convertState(S.units, wantUnits); S.units = wantUnits; }
      S.criteria.factor = code.approach === "ASD" ? code.factorOfSafety : code.resistanceFactor;
      S.criteria.settlement = round(Burh.units(S.units).fromSettle(code.settlementLimit), 3);
      render(); return;
    }
    const uBtn = e.target.closest("#units button");
    if (uBtn && uBtn.dataset.u !== S.units) {
      convertState(S.units, uBtn.dataset.u); S.units = uBtn.dataset.u; render(); return;
    }
    const del = e.target.closest("[data-del]");
    if (del) {
      if (S.layers.length > 1) S.layers.splice(+del.dataset.del, 1);
      render(); return;
    }
    if (e.target.id === "addLayer") {
      const U = Burh.units(S.units);
      S.layers.push({ name: `Layer ${S.layers.length + 1}`,
        thickness: round(U.fromLength(3), 2), gamma: round(U.fromUnitWeight(19), 1),
        gammaSat: round(U.fromUnitWeight(20.5), 1), drainage: "drained",
        sptN: 20, phi: "", soilClass: "clean_sand_nc", es: "" });
      render();
    }
  });

  $("foot").innerHTML = `
    <b>Scope.</b> This checks geotechnical bearing capacity and settlement for a single
    rectangular spread footing. Reinforced concrete design &mdash; flexure, one-way and
    two-way shear, development &mdash; is NOT covered; the thickness shown is a self-weight
    estimate, not a structural design. Correlated soil parameters are estimates with roughly
    a factor-of-two scatter and do not replace laboratory or in-situ testing. Nothing here
    verifies code compliance, and the governing code edition, local amendments and the
    project geotechnical report take precedence over every default. Output requires review
    and sealing by a licensed engineer, who remains responsible for the design.<br><br>
    <b>Method.</b> Vesic general bearing capacity equation (Meyerhof and Hansen N<span class="g">&gamma;</span>
    selectable) on Meyerhof effective area; Schmertmann (1978) strain influence factor for
    granular settlement; Terzaghi one-dimensional consolidation with OCR and recompression
    for cohesive layers; Newmark integration of the Boussinesq point solution for stress
    distribution. The engine in this page is cross-checked against a separately validated
    reference implementation over 500 randomised cases &mdash; agreement to 4&times;10<sup>-15</sup>.`;

  render();
})();
</script>
