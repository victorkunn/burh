[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "burh"
version = "0.1.0"
description = "Batch shallow foundation design: bearing capacity, settlement, and auditable calculation packages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["geotechnical", "foundation", "bearing-capacity", "settlement", "civil-engineering"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Deliberately empty. The engine is pure standard library so it installs
# behind corporate IT policy and runs inside constrained embedded Python
# environments without a dependency review.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
burh = "burh.cli:main"

[tool.setuptools.packages.find]
include = ["burh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
